name: Feature request
description: Propose an improvement, a new platform adapter, or a new agent controller
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Agent Bridge is deliberately modular — new platforms and agents plug in behind
        narrow protocols without touching the core. If you're proposing a new component,
        the [architecture contract](https://htkuan.github.io/ai-agent-bridge/architecture/)
        describes exactly what it must provide.

  - type: dropdown
    id: kind
    attributes:
      label: Kind of proposal
      options:
        - New platform adapter
        - New agent controller
        - Improvement to an existing component
        - Core bridge / configuration / other
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve? Who benefits and in what scenario?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen, and roughly how? Sketch the behavior, config, and UX.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered, and why this one is preferable.

  - type: textarea
    id: component
    attributes:
      label: For new platform / agent proposals
      description: |
        Fill this in if you selected "New platform adapter" or "New agent controller":
      placeholder: |
        - Session semantics: what maps to one conversation? (e.g. Slack thread, Telegram topic)
        - Connection mode: Socket/websocket, long-poll, webhook, HTTP server, scheduler?
        - For agents: which CLI/API does it drive, and does it support resuming a session?
        - Auth/config the component needs (tokens, URLs, ...)
        - Can it be tested fully offline (fake server / fake CLI)?
