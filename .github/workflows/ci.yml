name: CI

# Runs ruff (lint + format), pyright and the test suite on every PR targeting main
# and on every push to main. This is the merge gate: release.yml assumes
# anything landing on main is green. Tests run against all Python versions
# the package claims to support (requires-python >= 3.12). Version-bump
# commits pushed by python-semantic-release use GITHUB_TOKEN and therefore
# do not re-trigger this workflow.
#
# Every step below runs a Makefile target, so `make check` locally is the same
# gate as this workflow (see the Makefile).

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Lint
        # ruff check + ruff format --check. The Makefile switches ruff to
        # --output-format github when GITHUB_ACTIONS is set, so offending
        # lines are annotated in the PR diff.
        run: make lint

      - name: Pyright
        run: make typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        # Pinned to the full tag: setup-uv publishes no floating major tag
        # (v9 alone does not resolve). Bump to the latest v9.x as needed.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        # make install is `uv sync --locked`: --locked fails if uv.lock is out
        # of sync with pyproject.toml, so a stale lockfile is caught in CI
        # instead of silently re-resolving.
        run: make install

      - name: Run tests
        # e2e scenarios run in their own 3.12-only job below. The coverage
        # gate (fail_under) is enforced here, on the unit+integration subset.
        run: make test

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Run e2e scenarios
        # Full-stack scenarios spawn real subprocesses and are timing
        # sensitive; one interpreter gives enough signal. Coverage is owned
        # by the `test` job — the e2e subset alone would trip fail_under.
        # `not live` excludes the scenarios that spawn the real claude CLI:
        # they need credentials and spend tokens, so they stay opt-in and
        # local (make test-live). Belt and braces —
        # without the --live flag they would skip themselves anyway.
        run: make test-e2e
