name: CI

# Runs the test suite on every PR targeting main and on every push to main.
# This is the merge gate: release.yml assumes anything landing on main is
# green. Tests run against all Python versions the package claims to support
# (requires-python >= 3.12). Version-bump commits pushed by
# python-semantic-release use GITHUB_TOKEN and therefore do not re-trigger
# this workflow.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        # Pinned to the full tag: setup-uv publishes no floating major tag
        # (v9 alone does not resolve). Bump to the latest v9.x as needed.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        # --locked fails if uv.lock is out of sync with pyproject.toml, so a
        # stale lockfile is caught in CI instead of silently re-resolving.
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest
