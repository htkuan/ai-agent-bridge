name: Release

# Runs on every push to main. python-semantic-release inspects the
# Conventional Commits since the last v* tag, decides the next version,
# bumps pyproject.toml, writes CHANGELOG.md, tags, and creates a GitHub
# Release. If (and only if) a release was cut, the deploy job uploads the
# built distributions to PyPI via Trusted Publishing (OIDC, no secrets).
#
# Pushes made with GITHUB_TOKEN do not re-trigger workflows, so the version
# bump commit PSR pushes back to main will not cause a loop.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write # push the version bump commit + tag, create the GitHub Release
    outputs:
      released: ${{ steps.release.outputs.released || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # PSR needs full history + tags to compute the version
          ref: ${{ github.ref_name }}

      - name: Pin release branch to the triggering commit
        run: git reset --hard ${{ github.sha }}

      # TEMPORARY (2026-08-27): the python-semantic-release and publish-action
      # Docker actions build their image at run time from a requirements.txt
      # that pins only PSR itself, so every run resolves `gitpython~=3.0` to
      # whatever is newest on PyPI. GitPython 3.1.60 (2026-08-25) removed
      # `Actor.name_email_regex`, which PSR still calls while loading config,
      # so both actions now crash before doing any work -- on an unchanged
      # workflow. Run the same CLI ourselves with GitPython pinned instead.
      #   https://github.com/python-semantic-release/python-semantic-release/issues/1476
      #   https://github.com/python-semantic-release/python-semantic-release/pull/1477
      # Revert the next three steps back to the two `uses:` actions once a PSR
      # release carrying that fix is out.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python-semantic-release
        run: |
          python -m venv /tmp/psr
          /tmp/psr/bin/pip install --quiet \
            "python-semantic-release==10.5.3" "gitpython<3.1.60"
          # Prepend so `semantic-release` resolves here, and so the configured
          # build_command's `pip install uv` lands in this venv rather than the
          # runner's externally-managed Python (PSR forwards PATH to it).
          echo "/tmp/psr/bin" >> "$GITHUB_PATH"

      - name: Semantic version release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # What the action's git_committer_name/git_committer_email inputs set.
          GIT_COMMIT_AUTHOR: "github-actions <actions@users.noreply.github.com>"
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          semantic-release -v version

      - name: Attach distributions to the GitHub Release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release -v publish --tag "${{ steps.release.outputs.tag }}"

      - name: Upload distributions for the deploy job
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: distribution-artifacts
          path: dist
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    environment:
      name: pypi
      url: https://pypi.org/p/ai-agent-bridge
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: distribution-artifacts
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          print-hash: true
