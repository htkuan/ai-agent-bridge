# Agent Bridge configuration (YAML mode).
#
# Copy to ./agent-bridge.yaml (auto-discovered) or point at it explicitly with
# `agent-bridge -c path/to/file.yaml` or AGENT_BRIDGE_CONFIG=path/to/file.yaml.
#
# Precedence: environment variables > this file > built-in defaults.
# Every key maps 1:1 to an env var — see docs/configuration.md for the table.
#
# Secrets: never put them in the file. Write $(VAR) and the value is read from
# the environment at startup (missing vars fail fast with a clear error).
# A literal `$(` can be written as `$$(`.

log_level: INFO # AGENT_BRIDGE_LOG_LEVEL

# Which agent handles messages (single active agent). One of: claude, codex, opencode
agent: claude # AGENT_BRIDGE_AGENT

bridge:
  session_store_path: ./sessions.json # AGENT_BRIDGE_SESSION_STORE_PATH
  session_ttl_hours: 72 # AGENT_BRIDGE_SESSION_TTL_HOURS
  max_concurrent_sessions: 5 # AGENT_BRIDGE_MAX_CONCURRENT_SESSIONS
  # Cross-session prompt dedupe; ttl_seconds 0 disables the feature.
  dedupe:
    ttl_seconds: 0 # AGENT_BRIDGE_DEDUPE_TTL_SECONDS
    max_entries: 512 # AGENT_BRIDGE_DEDUPE_MAX_ENTRIES
    simhash_threshold: 0 # AGENT_BRIDGE_DEDUPE_SIMHASH_THRESHOLD

platforms:
  # Slack activates when both tokens are set; omit the section to disable.
  slack:
    bot_token: $(SLACK_BOT_TOKEN) # AGENT_BRIDGE_SLACK_BOT_TOKEN (xoxb-...)
    app_token: $(SLACK_APP_TOKEN) # AGENT_BRIDGE_SLACK_APP_TOKEN (xapp-...)
    # Optional: send a message after Socket Mode connects.
    # startup_notify_channel: C12345678   # AGENT_BRIDGE_SLACK_STARTUP_NOTIFY_CHANNEL
    # startup_notify_message: Bot is online  # AGENT_BRIDGE_SLACK_STARTUP_NOTIFY_MESSAGE
    # Optional channel-name allow-list (list or comma-separated string).
    # Empty/omitted = allow every channel; non-empty also blocks DMs.
    # allow_channels:                     # AGENT_BRIDGE_SLACK_ALLOW_CHANNELS
    #   - ops-alerts
    #   - team-eng
    # channel_not_allowed_message: Sorry, I'm not available here. # AGENT_BRIDGE_SLACK_CHANNEL_NOT_ALLOWED_MESSAGE
    # Usage/cost footer appended to the final reply.
    usage_report:
      enabled: false # AGENT_BRIDGE_SLACK_USAGE_REPORT_ENABLED
      # template: "💵 {cost_usd} | {total_tokens} tokens | {duration_s}s" # AGENT_BRIDGE_SLACK_USAGE_REPORT_TEMPLATE

  # Telegram activates when the bot token is set; omit the section to disable.
  # Long polling — no public URL needed. Requires the `telegram` extra.
  telegram:
    bot_token: $(TELEGRAM_BOT_TOKEN) # AGENT_BRIDGE_TELEGRAM_BOT_TOKEN (from @BotFather)
    # Optional chat-id allow-list (list or comma-separated string; group ids
    # are negative). Empty/omitted = allow every chat.
    # allow_chats:                      # AGENT_BRIDGE_TELEGRAM_ALLOW_CHATS
    #   - "-1001234567890"
    #   - "987654321"
    # poll_timeout_seconds: 30          # AGENT_BRIDGE_TELEGRAM_POLL_TIMEOUT_SECONDS
    # state_path: ./telegram.json       # AGENT_BRIDGE_TELEGRAM_STATE_PATH
    # api_base_url: https://api.telegram.org # AGENT_BRIDGE_TELEGRAM_API_BASE_URL

  # LINE activates when both secret and token are set; omit the section to
  # disable. Webhook — needs a public HTTPS URL in front of the server.
  # Requires the `line` extra.
  line:
    channel_secret: $(LINE_CHANNEL_SECRET) # AGENT_BRIDGE_LINE_CHANNEL_SECRET
    channel_access_token: $(LINE_CHANNEL_ACCESS_TOKEN) # AGENT_BRIDGE_LINE_CHANNEL_ACCESS_TOKEN
    # webhook:
    #   host: 0.0.0.0                     # AGENT_BRIDGE_LINE_WEBHOOK_HOST
    #   port: 8080                        # AGENT_BRIDGE_LINE_WEBHOOK_PORT
    #   path: /line/webhook               # AGENT_BRIDGE_LINE_WEBHOOK_PATH
    # api_base_url: https://api.line.me   # AGENT_BRIDGE_LINE_API_BASE_URL

  # Generic HTTP POST entry point (buffered JSON or SSE streaming).
  # Explicit opt-in; binds loopback by default. Requires the `api` extra.
  api:
    enabled: false # AGENT_BRIDGE_API_ENABLED
    # host: 127.0.0.1                   # AGENT_BRIDGE_API_HOST (0.0.0.0 to expose — read docs/platforms/api.md first)
    # port: 8081                        # AGENT_BRIDGE_API_PORT
    # Optional bearer token required on every /v1 request when set.
    # auth_token: $(API_AUTH_TOKEN)     # AGENT_BRIDGE_API_AUTH_TOKEN

  # Heartbeat fires a fixed prompt on a fixed interval. Explicit opt-in.
  heartbeat:
    enabled: false # AGENT_BRIDGE_HEARTBEAT_ENABLED
    # interval_minutes: 60              # AGENT_BRIDGE_HEARTBEAT_INTERVAL_MINUTES
    # prompt: Check your task list and work on the next item. # AGENT_BRIDGE_HEARTBEAT_PROMPT
    # state_path: ./heartbeat.json      # AGENT_BRIDGE_HEARTBEAT_STATE_PATH

agents:
  claude:
    work_dir: . # AGENT_BRIDGE_CLAUDE_WORK_DIR
    permission_mode: acceptEdits # AGENT_BRIDGE_CLAUDE_PERMISSION_MODE
    timeout_seconds: 600 # AGENT_BRIDGE_CLAUDE_TIMEOUT_SECONDS
    worktree_enabled: false # AGENT_BRIDGE_CLAUDE_WORKTREE_ENABLED
    effort: xhigh # AGENT_BRIDGE_CLAUDE_EFFORT (low|medium|high|xhigh|max)

  # OpenAI Codex CLI (`codex exec`). Active when `agent: codex` is selected.
  # Requires the codex CLI installed and logged in on the host.
  codex:
    work_dir: . # AGENT_BRIDGE_CODEX_WORK_DIR
    sandbox: workspace-write # AGENT_BRIDGE_CODEX_SANDBOX (read-only|workspace-write|danger-full-access)
    timeout_seconds: 600 # AGENT_BRIDGE_CODEX_TIMEOUT_SECONDS
    # model: gpt-5-codex               # AGENT_BRIDGE_CODEX_MODEL (unset = CLI default)
    # session_map_path: ./codex-sessions.json # AGENT_BRIDGE_CODEX_SESSION_MAP_PATH

  # OpenCode CLI (`opencode run`). Active when `agent: opencode` is selected.
  # Requires the opencode CLI installed and a provider authenticated on the
  # host (`opencode auth login`).
  opencode:
    work_dir: . # AGENT_BRIDGE_OPENCODE_WORK_DIR
    timeout_seconds: 600 # AGENT_BRIDGE_OPENCODE_TIMEOUT_SECONDS
    # model: anthropic/claude-sonnet-4-5 # AGENT_BRIDGE_OPENCODE_MODEL (provider/model; unset = CLI default)
    # session_map_path: ./opencode-sessions.json # AGENT_BRIDGE_OPENCODE_SESSION_MAP_PATH
