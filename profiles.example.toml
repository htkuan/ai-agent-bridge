# Named agent profiles + per-channel routing.
#
# Point AGENT_BRIDGE_PROFILES_PATH at a copy of this file to give different
# Slack channels differently-configured controllers. Environment variables
# keep holding the flat, global config (tokens, the default
# AGENT_BRIDGE_CLAUDE_* / AGENT_BRIDGE_PI_* settings); this file holds the
# structured part.
#
# Only five sections are recognised — [claude.profiles.*], [pi.profiles.*],
# [codex.profiles.*], [opencode.profiles.*] and [slack.channel_profiles] —
# anything else fails startup, as does any unknown field inside a profile.

# --- Named profiles -------------------------------------------------------
# Each [<agent>.profiles.<name>] table defines one named controller. Names
# must match [a-z0-9_-]+ ("default" is reserved for the env-built config)
# and are ONE global routing namespace: the same name can't be defined by
# two agent types. Any field left out inherits the value from that agent's
# global environment variables.
#
# Claude fields (same meaning as their env counterparts): work_dir,
# permission_mode, timeout_seconds, worktree_enabled, effort, model, cli_path.

[claude.profiles.backend]
work_dir = "/repos/backend"

[claude.profiles.infra]
work_dir = "/repos/infra"
permission_mode = "plan"
model = "claude-opus-5"
timeout_seconds = 900

# Pi fields: work_dir, provider, model, thinking, timeout_seconds, cli_path,
# tools, exclude_tools. Pi has no sandbox — the tools allowlist is its
# permission model (docs/agents/pi.md).

[pi.profiles.quick]
work_dir = "/repos/backend"
thinking = "low"
tools = ["read", "grep", "find", "ls"]

# Codex fields: work_dir, sandbox_mode, model, effort, timeout_seconds,
# cli_path, skip_git_repo_check, session_map_path. The sandbox mode is
# codex's permission model (docs/agents/codex.md).

[codex.profiles.reviewer]
work_dir = "/repos/backend"
sandbox_mode = "read-only"

# Opencode fields: work_dir, model (a provider/model string), variant,
# timeout_seconds, cli_path, session_map_path. Opencode has no sandbox —
# a profile is effectively full-access (docs/agents/opencode.md).

[opencode.profiles.oc]
work_dir = "/repos/backend"
model = "anthropic/claude-opus-5"

# --- Slack channel routing ------------------------------------------------
# Channel NAME (not ID) → profile name. Names are matched like
# AGENT_BRIDGE_SLACK_ALLOW_CHANNELS: '#', whitespace, and case are ignored.
# Channels not listed here (and DMs, which have no name) use the default
# env-built controller. If AGENT_BRIDGE_SLACK_ALLOW_CHANNELS is set, every
# channel mapped here must also be on that allow-list.
#
# Remapping a channel to a different profile starts fresh sessions for its
# threads — a session created under one profile's work_dir cannot be
# resumed under another's.

[slack.channel_profiles]
backend-team = "backend"
infra-ops = "infra"
quick-qa = "quick"
code-review = "reviewer"
oc-dev = "oc"
