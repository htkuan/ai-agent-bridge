[project]
name = "ai-agent-bridge"
version = "0.3.0"
description = "Modular bridge between chat platforms and AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "htkuan" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
slack = ["slack-bolt>=1.21.0", "aiohttp>=3.9.0"]
all = ["ai-agent-bridge[slack]"]

[project.urls]
Repository = "https://github.com/htkuan/ai-agent-bridge"

[project.scripts]
agent-bridge = "agent_bridge:main_sync"

[dependency-groups]
dev = [
    "ai-agent-bridge[all]",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "python-semantic-release>=10",
    "pre-commit>=3.7.0",
    "ruff>=0.14",
    "pyright[nodejs]>=1.1",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Coverage on by default so plain `uv run pytest` (local and every CI matrix
# job) enforces the same gate. Partial runs (a single file / -k) undercount
# coverage and trip fail_under — add --no-cov for those.
addopts = "--cov=src/agent_bridge --cov-report=term-missing"

[tool.coverage.report]
# Ratchet floor, not a target: 75% is the measured baseline (2026-08-08).
# Raise it as coverage improves; never lower it. Known gaps: slack/adapter.py,
# __init__.py, config.py — core modules (bridge/dedupe/events) sit at 100%.
fail_under = 75

[tool.semantic_release]
# Version lives in [project].version; PSR bumps it from Conventional Commits.
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_parser = "conventional"
# Stay in 0.x: a breaking change bumps the MINOR (0.1.0 -> 0.2.0), not 1.0.0.
# Flip major_on_zero to true (or hand-bump to 1.0.0) when the API is stable.
allow_zero_version = true
major_on_zero = false
# uv lock re-stamps the project version in uv.lock after PSR bumps
# pyproject.toml; assets commits the refreshed lockfile with the version
# bump so `uv sync --locked` (CI) doesn't fail on drift after a release.
build_command = "pip install uv && uv lock && uv build"
assets = ["uv.lock"]

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
exclude_commit_patterns = [
  "^Merge pull request",
  "^Merge branch",
]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear (common bug patterns)
    "UP",      # pyupgrade (keep syntax modern)
    "SIM",     # flake8-simplify
    "S",       # bandit security checks
    "ASYNC",   # async/await pitfalls
    "C90",     # mccabe complexity
    "RUF",     # ruff-native rules
]

[tool.ruff.lint.per-file-ignores]
# assert is the point of tests; S105/S106 false-positive on dummy tokens;
# S603/S607/ASYNC221: tests deliberately spawn fixture subprocesses.
"tests/*" = ["S101", "S105", "S106", "S603", "S607", "ASYNC221"]

[tool.pyright]
include = ["src", "tests/fakes", "tests/contracts"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
# slack-bolt/slack-sdk ship no type information, so their members surface as
# Unknown. Contain that at the adapter package instead of sprinkling ignores;
# everything else in src stays fully strict.
[[tool.pyright.executionEnvironments]]
root = "src/agent_bridge/platforms/slack"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
