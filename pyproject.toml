[project]
name = "ai-agent-bridge"
version = "0.2.0"
description = "Modular bridge between chat platforms and AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "htkuan" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
slack = ["slack-bolt>=1.21.0", "aiohttp>=3.9.0"]
all = ["ai-agent-bridge[slack]"]

[project.urls]
Repository = "https://github.com/htkuan/ai-agent-bridge"

[project.scripts]
agent-bridge = "agent_bridge:main_sync"

[dependency-groups]
dev = [
    "ai-agent-bridge[all]",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "python-semantic-release>=10",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests wiring real components together (config chain, fake CLI through real controller/bridge); still fully offline",
]

[tool.semantic_release]
# Version lives in [project].version; PSR bumps it from Conventional Commits.
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_parser = "conventional"
# Stay in 0.x: a breaking change bumps the MINOR (0.1.0 -> 0.2.0), not 1.0.0.
# Flip major_on_zero to true (or hand-bump to 1.0.0) when the API is stable.
allow_zero_version = true
major_on_zero = false
build_command = "pip install uv && uv build"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
exclude_commit_patterns = [
  "^Merge pull request",
  "^Merge branch",
]
